name: Release

# Builds every platform plus the Pi agent and publishes them as a GitHub
# release when a v* tag is pushed (git tag v1.0.0 && git push --tags).
#
# ## The asset names are a contract
#
# The download buttons on the website (site/index.html, site/js/download.js)
# ask for these exact names, and releases/latest/download/<name> is a permanent
# link — the Pi setup instructions use it for the agent:
#
#   PiKeep-macos.dmg               PiKeep-windows-x64.zip
#   PiKeep-linux-x86_64.AppImage   PiKeep-android-universal.apk
#   PiKeep-ios-unsigned.zip        PiKeep-pi-agent.tar.gz
#
# No version in a filename: the tag carries it. tool/check_site.sh fails if the
# site asks for a name this file does not publish.
#
# The Xcode projects are not committed (see .gitignore), so every job runs
# tool/setup_platforms.sh first to generate whatever is missing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  pi-agent:
    name: Pi agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck pi/pi-backup-agent pi/install.sh
      - name: Package the agent
        run: |
          mkdir -p dist "$RUNNER_TEMP/pikeep-pi-agent"
          install -m 0755 pi/pi-backup-agent pi/install.sh "$RUNNER_TEMP/pikeep-pi-agent/"
          install -m 0644 pi/agent.conf "$RUNNER_TEMP/pikeep-pi-agent/"
          tar czf dist/PiKeep-pi-agent.tar.gz -C "$RUNNER_TEMP" pikeep-pi-agent
      - uses: actions/upload-artifact@v4
        with:
          name: pi-agent
          path: dist/*

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh
      - run: flutter pub get
      # A stable upload key lets each APK install over the previous one.
      # Without the secrets the build falls back to a throwaway debug key
      # (see android/app/build.gradle.kts).
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "::warning title=Unsigned APK::ANDROID_KEYSTORE_* secrets not set; signing with a debug key. Releases won't update in place."
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set all four secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          {
            echo "storeFile=$KEYSTORE"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      # One universal APK: someone sideloading wants the single file that works.
      - run: flutter build apk --release
      - name: Name the APK and log its signing certificate
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PiKeep-android-universal.apk
          # Logged so consecutive releases can be compared: same SHA-256 = updates install in place.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs dist/PiKeep-android-universal.apk | grep -E 'DN|SHA-256'
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh
      - run: flutter pub get
      # Unsigned: signing needs an Apple certificate and provisioning profile.
      - run: flutter build ios --release --no-codesign
      # Zipped with ditto: Runner.app is a directory, and ditto keeps its symlinks.
      - run: |
          mkdir -p dist
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app dist/PiKeep-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh
      - run: flutter pub get
      - run: flutter build macos --release
      # Unsigned and un-notarised; the website explains how to open it.
      - name: Package a DMG
        run: |
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING" dist
          cp -R build/macos/Build/Products/Release/PiKeep.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname PiKeep -srcfolder "$STAGING" -ov -format UDZO dist/PiKeep-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh
        shell: bash
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package a portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/PiKeep-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libfuse2 desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package an AppImage
        run: |
          APPDIR="$RUNNER_TEMP/PiKeep.AppDir"
          mkdir -p "$APPDIR/usr/bin" dist
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"
          cp assets/icon/icon.png "$APPDIR/pikeep.png"
          cat > "$APPDIR/pikeep.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=PiKeep
          Comment=Remote control for Raspberry Pi backups
          Exec=pikeep
          Icon=pikeep
          Categories=Utility;Archiving;
          Terminal=false
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/pikeep" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" dist/PiKeep-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    name: GitHub release
    needs: [pi-agent, android, ios, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Published, not drafted: the site's links resolve through
          # releases/latest, which skips drafts. A tag with a hyphen
          # (v1.1.0-rc1) becomes a prerelease, which releases/latest also skips.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/PiKeep-macos.dmg
            artifacts/PiKeep-windows-x64.zip
            artifacts/PiKeep-linux-x86_64.AppImage
            artifacts/PiKeep-android-universal.apk
            artifacts/PiKeep-ios-unsigned.zip
            artifacts/PiKeep-pi-agent.tar.gz
