# /etc/pi-backup/agent.conf — configuration for pi-backup-agent (sourced by bash, root-owned, 0644)

# Space-separated list of directories the app may browse and back up.
ALLOWED_ROOTS="/mnt/ssd"

# Refuse to back up unless this is a mounted filesystem (protects against backing up an empty dir).
REQUIRED_MOUNT="/mnt/ssd"

# restic repository password (keep a copy OFF the Pi, e.g. in a password manager).
RESTIC_PASSWORD_FILE="/root/.restic-pass"

# rclone config holding the OneDrive remote.
RCLONE_CONFIG="/root/.config/rclone/rclone.conf"

# Where database dumps are written before they are backed up.
STAGING_DIR="/mnt/ssd/backup-staging"

# Defaults offered to a freshly installed app.
DEFAULT_REMOTE="onedrive"
DEFAULT_REPO_PATH="pi-backup"
DEFAULT_KEEP_LAST=2

# Restore to a separate folder writes into a new subfolder here (must be inside ALLOWED_ROOTS).
# Default: <REQUIRED_MOUNT>/restore
#RESTORE_DIR="/mnt/ssd/restore"

# Safety net for keep-last-N clean-up: if a source's new backup holds less than this
# percentage of the files or bytes of its largest earlier backup (an emptied folder,
# a half-dead disk), the older backups are kept and you get a warning. 0 turns it off.
SHRINK_GUARD_PERCENT=50

# Alerts when a backup fails or needs attention: an ntfy-style URL, e.g.
# https://ntfy.sh/<a-long-random-topic>. Usually set from the app instead.
#NOTIFY_URL=""
