name: pikeep
description: PiKeep — remote control for encrypted restic backups running on a Raspberry Pi.
publish_to: none
version: 1.0.1+2

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.0
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
